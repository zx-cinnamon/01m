on:"💬",text:"Đáp lại bằng lời xúc phạm",safe:!1,risk:"Đáp trả bằng xúc phạm có thể làm xung đột và tổn thương tiếp tục."},{icon:"👥",text:"Đưa chuyện vào nhóm khác bàn",safe:!1,risk:"Đưa chuyện sang nhóm khác có thể mở rộng việc bàn tán và làm em tổn thương thêm."}]},{id:"kmm-2026-002",title:"Ảnh đại diện dễ mến",situation:"Một tài khoản có ảnh đại diện dễ mến xin địa chỉ nhà em. Em chọn cách nào?",tip:"ẢNH ĐẠI DIỆN không chứng minh danh tính hoặc sự an toàn.",enabled:!0,options:[{icon:"🖼️",text:"Gửi vì ảnh trông rất hiền",safe:!1,risk:"Ảnh đại diện có thể thuộc người khác; vẻ ngoài không bảo đảm người liên hệ đáng tin."},{icon:"🏠",text:"Không gửi địa chỉ nhà riêng",safe:!0},{icon:"👤",text:"Gửi vì tên tài khoản quen",safe:!1,risk:"Tên trên mạng có thể giả; tên quen không xác nhận danh tính người đang hỏi."},{icon:"🎮",text:"Gửi vì đã chơi game cùng",safe:!1,risk:"Chơi cùng không tạo quyền được biết địa chỉ riêng của em."},{icon:"🎁",text:"Gửi để nhận quà người ấy tặng",safe:!1,risk:"Lời hứa tặng quà không bảo đảm an toàn khi tiết lộ nơi ở."}]},{id:"kmm-2026-003",title:"Quà kèm bí mật",situation:"Bạn quen qua game tặng quà rồi yêu cầu giấu bố mẹ và gửi ảnh riêng tư. Em nên làm gì?",tip:"Sự quan tâm kèm ÉP BUỘC, BÍ MẬT là dấu hiệu cần chú ý.",enabled:!0,options:[{icon:"🎁",text:"Gửi ảnh để cảm ơn món quà",safe:!1,risk:"Quà tặng có thể được dùng để tạo lòng tin; em không có nghĩa vụ đáp ứng yêu cầu gây bất an."},{icon:"🤐",text:"Giữ kín để được tặng tiếp",safe:!1,risk:"Giữ bí mật theo yêu cầu này có thể tách em khỏi sự hỗ trợ của người lớn."},{icon:"🤝",text:"Dừng lại, nhờ người lớn giúp",safe:!0},{icon:"📸",text:"Gửi một ảnh để thử phản ứng",safe:!1,risk:"Gửi thêm ảnh làm người kia có thêm thông tin riêng tư để gây áp lực."},{icon:"💬",text:"Hứa làm theo để giữ tình bạn",safe:!1,risk:"Tình bạn không đòi hỏi em làm điều không thoải mái để được tiếp tục quan tâm."}]},{id:"kmm-2026-004",title:"Người quen cũng có ranh giới",situation:"Một bạn cùng lớp liên tục đe dọa em qua tin nhắn. Em nên làm gì?",tip:"Nhận diện HÀNH VI gây hại, không chỉ tránh người lạ.",enabled:!0,options:[{icon:"🏫",text:"Bỏ qua vì là bạn cùng lớp",safe:!1,risk:"Người quen cũng có thể gây hại; quen biết không làm lời đe dọa trở nên an toàn."},{icon:"🤝",text:"Nhận lỗi để bạn ấy hài lòng",safe:!1,risk:"Nhận lỗi để chiều người đe dọa không giải quyết nguy cơ đang xảy ra."},{icon:"📤",text:"Gửi cho cả lớp cùng công kích",safe:!1,risk:"Kêu gọi công kích có thể làm xung đột lan rộng và tạo thêm tổn thương."},{icon:"🧑‍🏫",text:"Báo người lớn về lời đe dọa",safe:!0},{icon:"💬",text:"Tiếp tục tranh cãi đến cùng",safe:!1,risk:"Tranh cãi kéo dài khiến em tiếp tục tương tác với người đang đe dọa."}]},{id:"kmm-2026-005",title:"Đã đồng ý vẫn được dừng",situation:"Em từng đồng ý trò chuyện riêng nhưng nay bị ép gửi ảnh và thấy sợ. Em nên làm gì?",tip:"Đã đồng ý trước đây vẫn có quyền NÓI KHÔNG và dừng lại.",enabled:!0,options:[{icon:"📜",text:"Làm tiếp vì đã từng đồng ý",safe:!1,risk:"Sự đồng ý trước đó không buộc em tiếp tục một việc khiến mình sợ hãi."},{icon:"📸",text:"Gửi thêm một ảnh cho xong",safe:!1,risk:"Đáp ứng thêm có thể khiến yêu cầu và sự kiểm soát tiếp tục."},{icon:"⏳",text:"Xin thêm giờ rồi làm theo",safe:!1,risk:"Trì hoãn nhưng vẫn làm theo không giải quyết yêu cầu ép buộc."},{icon:"🤐",text:"Giấu chuyện để giữ lời hứa",safe:!1,risk:"Lời hứa không nên ngăn em tìm hỗ trợ khi cảm thấy không an toàn."},{icon:"🛑",text:"Từ chối, dừng và tìm trợ giúp",safe:!0}]},{id:"kmm-2026-006",title:"Trò đùa khiến bạn đau",situation:"Nhóm lớp liên tục chế ảnh một bạn rồi nói chỉ đùa. Em chứng kiến thì nên làm gì?",tip:"CHỈ ĐÙA không xóa được tổn thương do chế giễu, cô lập.",enabled:!0,options:[{icon:"🧑‍🏫",text:"Không hùa theo, nhờ thầy cô giúp",safe:!0},{icon:"😆",text:"Thả biểu tượng cười cho vui",safe:!1,risk:"Hưởng ứng có thể khuyến khích việc chế giễu tiếp tục."},{icon:"📤",text:"Gửi ảnh cho nhóm bạn thân",safe:!1,risk:"Chuyển sang nhóm khác làm nội dung gây hại lan rộng hơn."},{icon:"🖼️",text:"Làm thêm ảnh chế nhẹ hơn",safe:!1,risk:"Ảnh chế mới vẫn có thể làm người bị nhắm đến tổn thương."},{icon:"👥",text:"Tham gia vì cả lớp đều làm",safe:!1,risk:"Nhiều người tham gia không làm hành vi gây tổn thương trở nên đúng."}]},{id:"kmm-2026-007",title:"Tin nhắn được gửi riêng",situation:"Bạn gửi riêng cho em một chuyện gia đình. Nhóm lớp muốn xem. Em nên làm gì?",tip:"Được gửi riêng KHÔNG có nghĩa là được tự do chia sẻ.",enabled:!0,options:[{icon:"📤",text:"Gửi vì mình đã nhận tin",safe:!1,risk:"Việc nhận tin nhắn không đồng nghĩa được phép chia sẻ thông tin của người gửi."},{icon:"🔒",text:"Không chuyển tiếp chuyện riêng",safe:!0},{icon:"👥",text:"Chỉ gửi nhóm nhỏ cho kín",safe:!1,risk:"Nhóm nhỏ vẫn là người nhận mới và nội dung có thể tiếp tục bị chuyển đi."},{icon:"📸",text:"Chụp lại thay vì chuyển tiếp",safe:!1,risk:"Ảnh chụp cũng làm lộ nội dung riêng tư như việc chuyển tiếp tin nhắn."},{icon:"✂️",text:"Bỏ tên rồi kể đầy đủ chuyện",safe:!1,risk:"Các chi tiết còn lại vẫn có thể làm người khác nhận ra bạn và chuyện riêng của bạn."}]},{id:"kmm-2026-008",title:"Không phải người đăng đầu",situation:"Em nhận được video làm nhục một bạn. Em không phải người quay. Em nên làm gì?",tip:"CHIA SẺ LẠI cũng có thể kéo dài tổn thương.",enabled:!0,options:[{icon:"📤",text:"Chuyển vì mình không quay",safe:!1,risk:"Người chuyển tiếp vẫn góp phần mở rộng phạm vi của nội dung gây hại."},{icon:"👀",text:"Gửi để hỏi ai đã xem rồi",safe:!1,risk:"Hỏi bằng cách gửi lại vẫn làm video đến thêm người."},{icon:"🛑",text:"Không chuyển tiếp video gây hại",safe:!0},{icon:"🗂️",text:"Lưu để gửi khi có người hỏi",safe:!1,risk:"Giữ nội dung để chia sẻ tiếp có thể kéo dài việc lan truyền."},{icon:"💬",text:"Bình luận để kéo mọi người xem",safe:!1,risk:"Bình luận thu hút chú ý có thể khiến người bị nhắm đến tiếp tục bị bàn tán."}]},{id:"kmm-2026-009",title:"Chưa đủ nghiêm trọng?",situation:"Một cuộc trò chuyện khiến em bất an nhưng chưa có lời đe dọa rõ ràng. Em nên làm gì?",tip:"Cảm thấy KHÔNG AN TOÀN đã đủ để dừng và tìm hỗ trợ.",enabled:!0,options:[{icon:"⏳",text:"Chờ bị đe dọa rõ mới kể",safe:!1,risk:"Em không cần chờ sự việc nghiêm trọng hơn mới được tìm hỗ trợ."},{icon:"💬",text:"Trò chuyện tiếp để thử xem",safe:!1,risk:"Tiếp tục để kiểm tra có thể kéo dài tình huống khiến em bất an."},{icon:"🎭",text:"Giả vờ thoải mái để giữ bạn",safe:!1,risk:"Che giấu cảm giác bất an khiến người hỗ trợ khó nhận ra em đang cần giúp."},{icon:"🤝",text:"Dừng lại, nói với người tin cậy",safe:!0},{icon:"🤐",text:"Giữ kín vì chưa mất gì cả",safe:!1,risk:"Nguy cơ và tổn thương không chỉ được đánh giá bằng việc đã mất tiền hay đồ vật."}]},{id:"kmm-2026-010",title:"Lỡ gửi thông tin",situation:"Em lỡ gửi thông tin riêng cho người đang gây áp lực. Em xấu hổ và muốn giấu. Nên làm gì?",tip:"Lỡ làm theo KHÔNG làm mất quyền được bảo vệ.",enabled:!0,options:[{icon:"🤐",text:"Giấu vì mình đã gửi trước",safe:!1,risk:"Giấu vì tự trách có thể làm chậm việc nhận hỗ trợ và bảo vệ."},{icon:"📤",text:"Gửi thêm để họ giữ kín",safe:!1,risk:"Đáp ứng thêm không bảo đảm người gây áp lực sẽ dừng lại."},{icon:"💬",text:"Tự thương lượng cho xong",safe:!1,risk:"Tự thương lượng có thể khiến em tiếp tục bị kiểm soát và đe dọa."},{icon:"🧹",text:"Xóa hết rồi coi như chưa có",safe:!1,risk:"Xóa thông tin liên quan có thể làm khó việc xác minh và xử lý sau này."},{icon:"🤝",text:"Dừng gửi thêm, tìm người giúp",safe:!0}]},{id:"kmm-2026-011",title:"Mở lời tìm hỗ trợ",situation:"Em muốn nhờ thầy cô giúp nhưng chưa sẵn sàng kể hết chuyện trên mạng. Em nên làm gì?",tip:"Có thể bắt đầu bằng MỘT CÂU; không cần kể hết ngay.",enabled:!0,options:[{icon:"💬",text:"Nói em đang thấy không an toàn",safe:!0},{icon:"📚",text:"Chờ nhớ hết mọi chi tiết",safe:!1,risk:"Không cần nhớ đủ mọi chi tiết mới được bắt đầu tìm sự giúp đỡ."},{icon:"🤐",text:"Im lặng đến khi tự xử lý xong",safe:!1,risk:"Tự xử lý rồi mới kể có thể làm em mất cơ hội được hỗ trợ sớm."},{icon:"👥",text:"Kể trước trong nhóm đông người",safe:!1,risk:"Kể công khai có thể là
